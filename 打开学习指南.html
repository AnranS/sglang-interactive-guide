itLab(c.lab);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[current]=Number(b.dataset.answer);save();feedback();});feedback();$('#prev').onclick=()=>location.hash=current-1;$('#next').onclick=()=>location.hash=current+1;$('#mark').onclick=()=>{completed=completed.includes(current)?completed.filter(i=>i!==current):[...completed,current];save();nav();$('#mark').textContent=completed.includes(current)?'✓ 已学完（点击撤销）':'标记本章已学完';};if($('#copyCode'))$('#copyCode').onclick=()=>copy(c.code,$('#copyCode'));}
function sourceUrl(p){const sha='5200508b0fd25733752c2c5e3af5539508023c27';return 'https://github.com/sgl-project/sglang/blob/'+sha+'/python/sglang/'+(p.startsWith('../')?p.slice(3):'srt/'+p);}
function feedback(){let a=answers[current],c=C[current];if(!Number.isInteger(a)||a<0||a>=c.choices.length)return;document.querySelectorAll('[data-answer]').forEach(b=>b.classList.toggle('selected',+b.dataset.answer===a));$('#feedback').textContent=(a===c.answer?'回答正确。':'再想一下。')+c.explain;$('#feedback').style.color=a===c.answer?'#137c63':'#965127';}
async function copy(s,b){try{await navigator.clipboard.writeText(s);b.textContent='已复制';}catch(e){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();b.textContent=ok?'已复制':'请手动选择代码复制';}}
function range(id,title,min,max,value,step=1){return `<label>${title} <input id="${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}"><output id="${id}Value">${value}</output></label>`;}
function bindRange(id,fn){$('#'+id).oninput=()=>{$('#'+id+'Value').textContent=$('#'+id).value;fn();};}
function tokens(n,hit=0){return Array.from({length:n},(_,i)=>`<span class="token ${i<hit?'hit':''}">${i+1}</span>`).join('');}
function initLab(type){const lab=$('#lab');
if(type==='flow'){let step=0;let labels=['Tokenize','Schedule','Prefill','Decode','Respond'],ex=['消息经聊天模板转换并编码为 token IDs。','请求排队；调度器按预算选择批次。','处理未缓存输入，建立 KV 并产生首个输出 token。','基于历史 KV 继续生成，直到终止条件。','反分词并返回结果；流式模式可在生成期间逐段返回。'];lab.innerHTML='<p>点“下一步”，追踪请求从输入到返回的状态。这里将流式返回简化为最后一站。</p><div class="flow" id="flow"></div><div class="status" id="state" role="status"></div><div class="controls"><button class="primary" id="step">下一步 →</button><button id="reset">重新开始</button><span id="counter"></span></div>';function draw(){ $('#flow').innerHTML=labels.map((s,i)=>`<div class="node ${i===step?'on':''}"><small>0${i+1}</small>${s}</div>`).join('');$('#state').textContent=ex[step];$('#counter').textContent=`${step+1} / 5`;$('#step').disabled=step===4;}$('#step').onclick=()=>{step++;draw();};$('#reset').onclick=()=>{step=0;draw();};draw();}
if(type==='architecture'){let list=[['HTTP Server','接收 API 调用，验证与编排请求。','entrypoints/http_server.py'],['TokenizerManager','输入编码与请求输出管理，连接 API 和运行时。','managers/tokenizer_manager.py'],['Scheduler','组织待处理与运行批次，协调资源。','managers/scheduler.py'],['ModelRunner','将批次转换为模型 forward 与执行路径。','model_executor/model_runner.py'],['RadixCache','查找、维护和淘汰可复用前缀对应的 KV。','mem_cache/radix_cache.py'],['DetokenizerManager','将输出 token IDs 增量还原为文本。','managers/detokenizer_manager.py']];lab.innerHTML='<p>接口 → 输入管理 → 调度 → 执行 → 输出。缓存与执行相互协作。</p><div class="arch-grid">'+list.map((x,i)=>`<button data-module="${i}">${x[0]}</button>`).join('')+'</div><div class="status" id="moduleState" role="status"></div>';function choose(i){document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',+b.dataset.module===i));$('#moduleState').innerHTML=esc(list[i][1])+'<br><code>'+list[i][2]+'</code>';}document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>choose(+b.dataset.module));choose(0);}
if(type==='phases'){lab.innerHTML='<p>假定前缀未命中，普通自回归生成；色块表示位置，不表示等长时间。</p><div class="controls">'+range('input','输入 token',4,32,12)+range('output','新输出 token',1,12,6)+'</div><div id="phaseResult"></div>';function draw(){let n=+$('#input').value,m=+$('#output').value;$('#phaseResult').innerHTML=`<p style="margin-top:18px">Prefill：处理 ${n} 个输入位置，得到第一个输出</p><div class="tokens">${tokens(n,n)}</div><p>后续 Decode：再推进 ${m-1} 轮，合计输出 ${m} 个 token</p><div class="tokens">${tokens(m,1)}</div><div class="status">首个输出来自 Prefill 的最后位置 logits；后续输出依次依赖之前的生成。</div>`;}bindRange('input',draw);bindRange('output',draw);draw();}
if(type==='batch'){let tick=0,done=[0,0,0,0],lengths=[2,6,3,2],mode='continuous',trace=[];lab.innerHTML='<p>两个槽位，A/B/C/D 同时到达，需要 2/6/3/2 轮 Decode。所有教学时间步等长。</p><div class="controls"><label>调度方式 <select id="batchMode"><option value="continuous">连续批处理</option><option value="static">静态分组</option></select></label><button class="primary" id="tick">推进一拍</button><button id="resetBatch">重置</button></div><div id="batchView"></div><div class="status" id="batchState" role="status"></div>';function draw(){let all=done.every((n,i)=>n===lengths[i]);$('#batchView').innerHTML=lengths.map((len,i)=>`<div class="batch-row"><strong>${'ABCD'[i]}</strong>${Array.from({length:len},(_,j)=>`<span class="dot ${j<done[i]?'hit':''}"></span>`).join('')} ${done[i]}/${len}</div>`).join('');$('#batchState').textContent=`第 ${tick} 拍 · ${all?'全部完成':trace.length?'本拍执行 '+trace.at(-1).join(' + '):'等待开始'}。${all?(mode==='continuous'?'连续模式 7 拍完成；静态模式需要 9 拍。':'静态模式 9 拍完成；连续模式需要 7 拍。'):''}`;$('#tick').disabled=all;}function reset(){tick=0;done=[0,0,0,0];trace=[];draw();}$('#batchMode').onchange=()=>{mode=$('#batchMode').value;reset();};$('#tick').onclick=()=>{let ids;if(mode==='continuous')ids=done.map((n,i)=>i).filter(i=>done[i]<lengths[i]).slice(0,2);else{let group=done[0]===2&&done[1]===6?[2,3]:[0,1];ids=group.filter(i=>done[i]<lengths[i]);}ids.forEach(i=>done[i]++);trace.push(ids.map(i=>'ABCD'[i]));tick++;draw();};$('#resetBatch').onclick=reset;draw();}
if(type==='memory'){lab.innerHTML='<p>教学模型：32 层 · 8 KV heads · head dim 128 · BF16（2 字节）。未分片 dense KV，不计分配与量化开销。</p><div class="controls">'+range('ctx','每请求上下文（K tokens，K=1024）',1,32,8)+range('reqs','同时保留的请求',1,16,1)+'</div><div class="metric" id="mem"></div><div class="status" id="memStatus"></div>';function draw(){let t=+$('#ctx').value*1024,r=+$('#reqs').value,bytes=2*32*8*128*t*2*r;$('#mem').innerHTML=(bytes/2**30).toFixed(2)+' <small>GiB / KV 理论占用</small>';$('#memStatus').textContent=`2 × 32 × 8 × 128 × ${t.toLocaleString()} × 2 × ${r} = ${bytes.toLocaleString()} 字节。不包含模型权重与临时内存。`;}bindRange('ctx',draw);bindRange('reqs',draw);draw();}
if(type==='radix'){let cache=[];lab.innerHTML='<p>用空格分隔教学 token。先插入一个请求，再改末尾内容观察最长共享前缀。</p><label for="prompt" style="font-size:13px">请求 token 序列</label><input type="text" id="prompt" value="You are helpful explain KV cache" maxlength="250"><div class="controls"><button class="primary" id="insert">匹配并插入</button><button id="variant">换一个共享前缀的请求</button><button id="clearCache">清空缓存</button></div><div class="tokens" id="radixTokens"></div><div class="status" id="radixState" role="status">缓存为空。插入第一条请求建立路径。</div><div id="tree"></div>';$('#variant').onclick=()=>{$('#prompt').value='You are helpful explain radix tree';};$('#clearCache').onclick=()=>{cache=[];$('#tree').innerHTML='';$('#radixTokens').innerHTML='';$('#radixState').textContent='缓存已清空。';};$('#insert').onclick=()=>{let ts=$('#prompt').value.trim().split(/\s+/).filter(Boolean);if(!ts.length){$('#radixState').textContent='请输入至少一个教学 token。';return;}let match=0;cache.forEach(seq=>{let n=0;while(n<ts.length&&n<seq.length&&seq[n]===ts[n])n++;match=Math.max(match,n);});$('#radixTokens').innerHTML=ts.map((t,i)=>`<span class="token ${i<match?'hit':''}">${esc(t)}</span>`).join('');$('#radixState').textContent=`最长匹配 ${match} / ${ts.length} 个 token；未匹配后缀 ${ts.length-match} 个。这里只统计前缀，不推断精确可跳过计算量。`;if(!cache.some(s=>s.join(' ')===ts.join(' ')))cache.push(ts);let root={};cache.forEach(seq=>{let p=root;seq.forEach(t=>{p[t]??={};p=p[t];});});function tree(obj){return Object.entries(obj).map(([t,child])=>`<div class="tree">${esc(t)}${tree(child)}</div>`).join('');}$('#tree').innerHTML='<p style="margin-top:14px">前缀树（教学展示展开为逐 token 节点；实际 radix 会压缩连续边）</p>'+tree(root);};}
if(type==='chunk'){lab.innerHTML='<p>将 24 个输入 token 按预算分块。展示调度粒度，不模拟 GPU 时间。</p><div class="controls">'+range('chunkSize','chunk 预算',2,24,8)+'</div><div id="chunks"></div><div class="status" id="chunkState"></div>';function draw(){let n=+$('#chunkSize').value,a=[];for(let i=0;i<24;i+=n)a.push([i+1,Math.min(i+n,24)]);$('#chunks').innerHTML=a.map((p,i)=>`<div class="chunk">Chunk ${i+1}　tokens ${p[0]}–${p[1]}　(${p[1]-p[0]+1} tokens)</div>`).join('');$('#chunkState').textContent=`共 ${a.length} 块；各块之间存在调度机会，但是否插入其他工作取决于实现与预算。`;}bindRange('chunkSize',draw);draw();}
if(type==='sampling'){lab.innerHTML='<p>固定 logits = [3, 2, 1, 0, −1]，计算 softmax(logits / T)。不包含 top-k / top-p。</p><div class="controls">'+range('temp','Temperature',0.1,2,1,0.1)+'<label><input id="mask" type="checkbox">屏蔽候选 A（格式约束示意）</label></div><div class="bars" id="prob"></div><div class="status">较低温度使分布更集中。屏蔽非法候选后，对其余候选重新归一化。</div>';function draw(){let t=+$('#temp').value,mask=$('#mask').checked,v=[3,2,1,0,-1].map((x,i)=>mask&&i===0?0:Math.exp((x-3)/t)),sum=v.reduce((a,b)=>a+b);$('#prob').innerHTML=v.map((x,i)=>`<div class="bar-row"><span>Token ${'ABCDE'[i]}</span><div class="bar-track"><div class="bar-fill" style="width:${x/sum*100}%"></div></div><span>${(x/sum*100).toFixed(1)}%</span></div>`).join('');}bindRange('temp',draw);$('#mask').onchange=draw;draw();}
if(type==='parallel'){lab.innerHTML='<p>32 个教学 head 均分到各 rank；只展示切分关系，不代表实际模型全部分片细节。</p><div class="controls"><label>TP size <select id="tp"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label></div><div id="ranks"></div><div class="status" id="tpState"></div>';function draw(){let n=+$('#tp').value;$('#ranks').innerHTML=Array.from({length:n},(_,i)=>`<div class="chunk">Rank ${i}　heads ${i*32/n}–${(i+1)*32/n-1}　(${32/n} heads)</div>`).join('');$('#tpState').textContent=n===1?'单 rank，无跨 rank collective。':`${n} 个 rank 共同执行一个模型；需要在相应边界通信。切分比例不是加速比例。`;}$('#tp').onchange=draw;draw();}
if(type==='spec'){lab.innerHTML='<p>草稿候选为「缓存 / 提升 / 效率」。指定连续接受前缀，其余候选丢弃；修正 token 由真实算法处理。</p><div class="controls">'+range('accept','连续接受候选数',0,3,2)+'</div><div class="tokens" id="draft"></div><div class="status" id="specState"></div>';function draw(){let n=+$('#accept').value;$('#draft').innerHTML=['缓存','提升','效率'].map((s,i)=>`<span class="token ${i<n?'hit':'drop'}">${s}</span>`).join('');$('#specState').textContent=`保留 ${n} 个草稿 token，丢弃 ${3-n} 个。这个手动示例不实现概率接受与校正，也不据此计算真实加速比。`;}bindRange('accept',draw);draw();}
if(type==='transfer'){lab.innerHTML='<p>理想公式：时间 = KV 数据量 / 有效带宽。GiB 使用 2³⁰ 字节；GB/s 使用 10⁹ 字节/秒。</p><div class="controls">'+range('kv','KV 数据量（GiB）',0.25,4,1,0.25)+range('bw','有效带宽（GB/s）',5,100,25,5)+'</div><div class="metric" id="transferTime"></div><div class="status">这是纯传输的理想下界，不含排队、协议、同步、注册内存或计算时间。</div>';function draw(){$('#transferTime').innerHTML=(+$('#kv').value*2**30/(+$('#bw').value*1e9)*1000).toFixed(2)+' <small>ms / 理想传输时间</small>';}bindRange('kv',draw);bindRange('bw',draw);draw();}
if(type==='command'){lab.innerHTML='<p>命令生成器不会执行代码。需要先按官方文档准备真实运行环境。</p><div class="command-box"><label>模型路径 <input type="text" id="model" value="Qwen/Qwen3-0.6B" maxlength="150"></label><label>监听端口 <input type="number" id="port" min="1024" max="65535" value="30000"></label></div><pre id="cmd"></pre><button id="copyCmd" class="primary">复制启动命令</button><div class="status" id="cmdState">绑定 127.0.0.1，仅供同机客户端访问。</div>';let command='';function draw(){let m=$('#model').value.trim(),p=Number($('#port').value),valid=/^[a-zA-Z0-9_./-]+$/.test(m)&&Number.isInteger(p)&&p>=1024&&p<=65535;command=valid?`python -m sglang.launch_server \\\n  --model-path '${m}' \\\n  --host 127.0.0.1 --port ${p}`:'';$('#cmd').textContent=command||'请输入有效模型路径（字母、数字、_ . / -）与 1024–65535 的端口。';$('#copyCmd').disabled=!valid;}$('#model').oninput=draw;$('#port').oninput=draw;$('#copyCmd').onclick=()=>copy(command,$('#copyCmd'));draw();}
if(type==='metrics'){lab.innerHTML='<p>单请求教学记录：从请求发起计时。输出 token 数包括第一个 token；不等于服务吞吐 benchmark。</p><div class="controls">'+range('ttft','首 token（ms）',100,1000,300,50)+range('duration','总耗时（ms）',1100,5000,2000,100)+range('count','输出 token 数',2,100,50)+'</div><div class="metric" id="tpot"></div><div class="status" id="metricState"></div>';function draw(){let f=+$('#ttft').value,d=+$('#duration').value,n=+$('#count').value;$('#tpot').innerHTML=((d-f)/(n-1)).toFixed(2)+' <small>ms / TPOT</small>';$('#metricState').textContent=`TPOT = (${d} − ${f}) / (${n} − 1)。该请求全程平均输出速率 ${(n/(d/1000)).toFixed(2)} tokens/s；服务吞吐需要统计并发请求在统一时间窗内的总输出。`;}['ttft','duration','count'].forEach(id=>bindRange(id,draw));draw();}
}
window.addEventListener('hashchange',()=>{if(location.hash==='#main')return;render();window.scrollTo(0,0);});render();
</script></body></html>
